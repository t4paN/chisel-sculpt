name: Linux Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04

    env:
      DEBIAN_FRONTEND: noninteractive
      # Tag builds carry the version in the file name (itch and GitHub both show it).
      APPIMAGE: Chisel-Weasel-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}-x86_64.AppImage

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools and dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake git wget file \
            libgl-dev libglx-dev libegl-dev \
            libx11-dev libxfixes-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev pkg-config \
            python3 libfuse2 patchelf ca-certificates

      # The image's GLFW is 3.3, X11 only. 3.4 carries X11 and Wayland in one library
      # and picks at start-up; it loads the window-system libraries at run time, so a
      # static build adds no dependencies to the binary.
      - name: Build GLFW 3.4 (X11 + Wayland, static)
        run: |
          wget -q -O glfw-3.4.tar.gz https://github.com/glfw/glfw/archive/refs/tags/3.4.tar.gz
          echo "c038d34200234d071fae9345bc455e4a8f2f544ab60150765d7704e08f3dac01  glfw-3.4.tar.gz" | sha256sum -c -
          tar -xzf glfw-3.4.tar.gz
          cmake -S glfw-3.4 -B glfw-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGLFW_BUILD_WAYLAND=ON -DGLFW_BUILD_X11=ON \
            -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF
          cmake --build glfw-build -j$(nproc)
          cmake --install glfw-build

      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          VERSION=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="$GITHUB_REF_NAME"; fi
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release ${VERSION:+-DCHISEL_VERSION="$VERSION"}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/lib-fallback
          cp build/chisel AppDir/usr/bin/

          mkdir -p AppDir/usr/share/applications
          cp packaging/chisel.desktop AppDir/usr/share/applications/chisel.desktop

          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp assets/chisel-icon.png AppDir/usr/share/icons/hicolor/256x256/apps/chisel.png

      - name: Bundle shared libraries
        run: |
          cd AppDir
          for lib in $(ldd usr/bin/chisel | grep '=> /' | awk '{print $3}'); do
            case "$lib" in
              */libGL.so*|*/libEGL.so*|*/libGLX.so*|*/libGLdispatch.so*|*/libX11.so*|*/libxcb*.so*|*/libXext.so*|*/libXrandr.so*|*/libXinerama.so*|*/libXcursor.so*|*/libXi.so*|*/libXfixes.so*|*/libXrender.so*|*/libXau.so*|*/libXdmcp.so*)
                ;;
              */libc.so*|*/libpthread.so*|*/libdl.so*|*/librt.so*|*/libm.so*|*/ld-linux*)
                ;;
              */libwayland-*.so*|*/libffi.so*)
                # The host's must win (its Mesa shares libwayland-client with us and
                # needs its own newer one). AppRun adds this dir only on a host with
                # no libwayland at all.
                cp -v "$lib" usr/lib-fallback/
                ;;
              */libstdc++.so*|*/libgcc_s.so*)
                # NEVER bundle these: AppRun puts usr/lib first, so an old bundled
                # libstdc++ (from the 20.04 build container) shadows the host's and
                # Mesa's DRI driver — dlopen'd during GL context creation, built
                # against the *newer* host libstdc++ — fails to load → glfwCreateWindow
                # returns NULL → "Failed to create window" on rolling distros. Building
                # on 20.04 already floors the required GLIBCXX low enough for the host's.
                ;;
              *)
                cp -v "$lib" usr/lib/
                ;;
            esac
          done

      - name: Create AppRun
        run: |
          cp packaging/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          cp AppDir/usr/share/applications/chisel.desktop AppDir/
          cp AppDir/usr/share/icons/hicolor/256x256/apps/chisel.png AppDir/chisel.png

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "$APPIMAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chisel-linux-x64
          path: ${{ env.APPIMAGE }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APPIMAGE }}
