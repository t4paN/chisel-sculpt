<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Chisel</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
    /* Full-window canvas. The CSS size (100vw x 100vh) is authoritative — the app
       reads clientWidth/clientHeight each frame and sets the WebGPU surface + depth
       backing to match (dpr=1), so color/depth attachments never diverge.
       Height is 100dvh, not 100vh: on mobile Chrome 100vh is the height with the
       address bar RETRACTED, so while the bar shows the canvas ran that much past the
       visible bottom and the bottom UI sat under Android's back/home bar. dvh tracks
       the bar; the 100vh line is the fallback for browsers without it. */
    #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
              border: 0; outline: none; background: #1a1a1a; touch-action: none; }
    /* On-screen modifier buttons for phones, stacked down the left edge under the
       brush button. The app places and sizes them (left/top/--mod, set from
       ui_skin.cpp's rail), since only it knows where the brush button ends. Real DOM
       elements on top of the canvas, not ImGui: a thumb on them never reaches the
       canvas, so GLFW can't mistake it for the sculpting finger and the pinch tracker
       never counts it. Hidden until a finger touches the page. */
    #mods { position: fixed; left: 16px; top: 50%;
            display: none; flex-direction: column; gap: 12px; z-index: 50; }
    #mods.on { display: flex; }
    .mod { width: var(--mod, 80px); height: var(--mod, 80px); border-radius: 20px; box-sizing: border-box;
           border: 1px solid rgba(255,255,255,.14); background: rgba(30,30,34,.72);
           color: #c8c8cc; font: 600 15px/1.15 system-ui, sans-serif; text-align: center;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           touch-action: none; user-select: none; -webkit-user-select: none;
           -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    .mod small { font-weight: 400; font-size: 11px; opacity: .7; }
    .mod.held  { background: rgba(115,76,153,.92); color: #fff; }
    .mod.latch { background: rgba(115,76,153,.92); color: #fff; border: 2px solid #e6d2ff; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #787878; font-family: system-ui, sans-serif; font-size: 14px; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="boot">Loading Chisel…</div>
  <div id="mods">
    <div class="mod" id="modCtrl">Ctrl<small>invert</small></div>
    <div class="mod" id="modShift">Shift<small>smooth</small></div>
  </div>
  <script>
    // On-page console overlay: mirrors console.log/warn/error and uncaught
    // errors into a floating panel. Always wired — itch serves the app in an
    // iframe that never sees the page's query params, so gating on ?debug=1
    // made `~` dead on itch. Hidden by default; the `~` key toggles it
    // (quake-style); ?debug=1 opens it at boot (keyboard-less devices, LAN
    // testing). Mirroring stays wired while hidden, so nothing is lost
    // before the panel is opened. Capped to the last 400 lines.
    var dbgPane = null;
    {
      dbgPane = document.createElement('pre');
      dbgPane.style.cssText = 'position:fixed;left:0;bottom:0;max-height:45vh;width:100vw;' +
        'margin:0;padding:4px 6px;overflow-y:auto;z-index:99;box-sizing:border-box;' +
        'background:rgba(0,0,0,.75);color:#9f9;font:10px/1.4 monospace;white-space:pre-wrap;' +
        'pointer-events:auto;display:' +
        (/[?&]debug=1/.test(location.search) ? 'block' : 'none');
      document.body.appendChild(dbgPane);
      // `~` (Backquote) toggles the panel. Captured on window so it fires
      // regardless of focus, and swallowed so the backtick never reaches the app.
      window.addEventListener('keydown', function(e) {
        if (e.code === 'Backquote' || e.key === '`' || e.key === '~') {
          e.preventDefault(); e.stopPropagation();
          var hidden = dbgPane.style.display === 'none';
          dbgPane.style.display = hidden ? 'block' : 'none';
          if (hidden) dbgPane.scrollTop = dbgPane.scrollHeight;
        }
      }, true);
      // LAN dev relay: served by ~/CHISEL/.lan-https/serve.py (port 8642, never itch),
      // console lines are batched and POSTed back to it, so the laptop can read the
      // phone's log live. Touch pointer events are logged too, for input debugging.
      var relayBuf = [];
      var relayOn = location.port === '8642';
      if (relayOn) {
        setInterval(function() {
          if (!relayBuf.length) return;
          var body = relayBuf.join('\n'); relayBuf = [];
          fetch('/log', { method: 'POST', body: body, keepalive: true }).catch(function() {});
        }, 400);
        ['pointerdown', 'pointerup', 'pointercancel'].forEach(function(t) {
          window.addEventListener(t, function(e) {
            if (e.pointerType !== 'touch') return;
            relayBuf.push('[ptr] ' + t + ' id=' + e.pointerId + ' ' + Math.round(e.clientX) + ',' +
                          Math.round(e.clientY) + ' on=' + (e.target.id || e.target.tagName) +
                          ' fs=' + (document.fullscreenElement ? 1 : 0) +
                          ' ' + innerWidth + 'x' + innerHeight);
          }, true);
        });
      }
      var dbgWrap = function(fn, tag, color) {
        return function() {
          fn.apply(console, arguments);
          if (relayOn) relayBuf.push(tag + Array.prototype.join.call(arguments, ' '));
          var line = document.createElement('div');
          if (color) line.style.color = color;
          line.textContent = tag + Array.prototype.map.call(arguments, function(a) {
            try { return typeof a === 'string' ? a : JSON.stringify(a); }
            catch (e) { return String(a); }
          }).join(' ');
          dbgPane.appendChild(line);
          while (dbgPane.childNodes.length > 400) dbgPane.removeChild(dbgPane.firstChild);
          dbgPane.scrollTop = dbgPane.scrollHeight;
        };
      };
      console.log   = dbgWrap(console.log.bind(console),   '', null);
      console.warn  = dbgWrap(console.warn.bind(console),  '[warn] ', '#ff9');
      console.error = dbgWrap(console.error.bind(console), '[err] ',  '#f99');
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[promise]', e.reason && (e.reason.message || String(e.reason)));
      });
      console.log('[dbg] overlay ready (press ~ to toggle); ua: ' + navigator.userAgent);
      console.log('[dbg] secureContext=' + window.isSecureContext +
                  ' webgpu=' + (navigator.gpu ? 'yes' : 'NO'));
    }
    // The app owns F1–F3 (view snaps) and F9/F10 (debug). Suppress the browser
    // defaults — F3's find bar and F10's menu focus steal keyboard focus from
    // the page, so the NEXT app key goes to the browser instead (F1 → help tab).
    // Capture-phase and registered before the runtime script, so this runs
    // ahead of GLFW's window listener; preventDefault still lets GLFW see the
    // key. F12 is deliberately left alone: devtools outranks its debug toggle.
    // Alt is swallowed while the app is focused and windowed: a bare Alt tap
    // otherwise pops Firefox's menu bar, which steals keyboard focus (took a
    // second Alt to get it back). Guarded so it never fights the browser when
    // the page is backgrounded or fullscreen (no menu bar there anyway). As
    // with the F-keys, preventDefault still lets GLFW see the key, so Alt-
    // modified brush gestures keep working. Firefox activates the menu on Alt
    // keyUP, so both edges are handled.
    function appOwnsAlt() {
      return document.hasFocus() && !document.fullscreenElement;
    }
    window.addEventListener('keydown', function(e) {
      if (['F1','F2','F3','F9','F10'].indexOf(e.key) !== -1) e.preventDefault();
      if (e.key === 'Alt' && appOwnsAlt()) e.preventDefault();
    }, true);
    window.addEventListener('keyup', function(e) {
      if (e.key === 'Alt' && appOwnsAlt()) e.preventDefault();
    }, true);
    // Middle-drag is the camera pan, but a middle mousedown is also Firefox's
    // autoscroll gesture (and the itch.io page around our iframe scrolls now
    // that it carries screenshots), so a pan would scroll the host page under
    // the app. Cancelling the mousedown default kills autoscroll; the wheel
    // guard is the same bug on the zoom gesture. Capture-phase and ahead of
    // GLFW's own listeners, and preventDefault only stops the browser default,
    // so the app still sees both events. Left/right buttons are untouched.
    window.addEventListener('mousedown', function(e) {
      if (e.button === 1) e.preventDefault();
    }, true);
    window.addEventListener('wheel', function(e) {
      e.preventDefault();
    }, { capture: true, passive: false });

    // Touch mode + the on-screen Ctrl / Shift buttons. Touch mode turns on at the
    // first finger anywhere on the page and off at the first real mouse move, so a
    // touchscreen laptop flips back the moment the mouse is used. Each button holds
    // its modifier while pressed; a quick tap (< 250 ms) latches it on until the next
    // tap, freeing the thumb. The app hears both through Module._chisel_touch_*.
    {
      var modsBox = document.getElementById('mods');
      var touchMode = false;
      var setTouchMode = function(on) {
        if (on === touchMode) return;
        touchMode = on;
        modsBox.classList.toggle('on', on);
        if (Module._chisel_touch_mode) Module._chisel_touch_mode(on ? 1 : 0);
      };
      window.addEventListener('pointerdown', function(e) {
        if (e.pointerType === 'touch') setTouchMode(true);
      }, true);
      window.addEventListener('pointermove', function(e) {
        if (e.pointerType === 'mouse' && (e.movementX || e.movementY)) setTouchMode(false);
      }, true);

      var mods = [];
      var sendMods = function() {
        if (Module._chisel_touch_mods)
          Module._chisel_touch_mods(mods[0].on() ? 1 : 0, mods[1].on() ? 1 : 0);
      };
      var makeMod = function(el) {
        var m = { held: false, latched: false, t0: 0, wasLatched: false };
        m.on = function() { return m.held || m.latched; };
        var paint = function() {
          el.classList.toggle('held', m.held && !m.latched);
          el.classList.toggle('latch', m.latched);
        };
        el.addEventListener('pointerdown', function(e) {
          e.preventDefault();
          el.setPointerCapture(e.pointerId);
          m.wasLatched = m.latched;
          m.latched = false;
          m.held = true;
          m.t0 = performance.now();
          paint(); sendMods();
        });
        var up = function(e) {
          if (!m.held) return;
          m.held = false;
          // A quick tap latches; a tap on a latched button just releases it.
          if (!m.wasLatched && e.type === 'pointerup' && performance.now() - m.t0 < 250)
            m.latched = true;
          paint(); sendMods();
        };
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);
        el.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        return m;
      };
      mods.push(makeMod(document.getElementById('modCtrl')));
      mods.push(makeMod(document.getElementById('modShift')));
    }

    var canvasElement = document.getElementById('canvas');
    canvasElement.addEventListener('webglcontextlost', function(e) {
      alert('Graphics context lost — reload the page.'); e.preventDefault();
    }, false);
    var Module = {
      print:   function() { console.log.apply(console, arguments); },
      printErr: function() { console.error.apply(console, arguments); },
      canvas:  canvasElement,
      onRuntimeInitialized: function() {
        var b = document.getElementById('boot'); if (b) b.remove();
      }
    };
    window.onerror = function(msg, src, line) {
      console.error('[onerror]', msg, src ? src + ':' + line : '');
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
